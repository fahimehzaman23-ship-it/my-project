# Base44 development stack for Horizon Properties.
# The repo IS the source of truth: it is bind-mounted into a plain Node runtime
# and served by the Vite dev server so every edit shows up live in the preview.
name: horizon-properties

services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Dependencies live in a volume so the bind mount can't hide them and they
      # survive restarts; the install above runs against the current manifest.
      - web_node_modules:/app/node_modules
    environment:
      # Vite >= 6.1 appends this to server.allowedHosts (the preview host rotates).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    restart: on-failure

volumes:
  web_node_modules:
